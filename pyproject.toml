[project]
name = "indian-trading-platform"
version = "0.1.0"
description = "Institutional-style solo trading control system for Indian cash equities"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "fastapi",
    "uvicorn",
    "httpx",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "yfinance>=0.2",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
    "mypy",
    "pre-commit",
    "pandas-stubs",
    "boto3-stubs[bedrock-runtime]>=1.34.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["UP047", "UP046"]

[tool.ruff.lint.per-file-ignores]
"services/**/__init__.py" = ["N999"]
"packages/contracts/exceptions.py" = ["N818"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["services/", "build/", "\\.eggs/"]
explicit_package_bases = true
mypy_path = "."
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["uvicorn", "httpx", "yfinance", "anthropic", "openai", "respx"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pytest_asyncio"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["packages/contracts", "packages/utils", "packages/observability", "apps/api/src", "services"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
